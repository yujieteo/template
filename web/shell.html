<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="icon" href="data:,">
<style>
/* Generated by scripts/to_web.py from web/shell.html. Colours come from theme-tokens.json. */
{{THEME_CSS}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--chrome);color:var(--fg);
  font:16px/1.5 Palatino,"Palatino Linotype","Book Antiqua","URW Palladio L",P052,Georgia,serif}
button,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid var(--border);border-radius:4px;padding:0 6px;background:var(--surface)}

/* Stage: the slide, letterboxed at 16:9 inside the free area. */
#main{position:fixed;inset:0;display:flex;flex-direction:column}
#area{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:12px}
/* Sized by fit() to the largest 16:9 box that fits the area. */
#stage{position:relative;flex:none;width:640px;height:360px;background:var(--bg);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 32px rgba(0,0,0,.12);border-radius:6px;overflow:hidden}
#stage img{position:absolute;inset:0;width:100%;height:100%;display:block;transition:opacity .18s}
#stage img.back{opacity:0}
@media (prefers-reduced-motion:reduce){#stage img{transition:none}}
#stage .hit{position:absolute;top:0;bottom:0;width:30%;cursor:pointer;background:none;border:0}
#stage .hit.l{left:0}#stage .hit.r{right:0}

/* Bottom bar: progress, counter, controls. Never part of the slide. */
#bar{display:flex;align-items:center;gap:6px;padding:6px 12px 8px;color:var(--secondary);font-size:14px;user-select:none;overflow-x:auto}
#bar #count{white-space:nowrap}
#bar .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:720px){#bar .title{display:none}#bar{gap:2px;padding:4px 6px 6px}#bar button{padding:6px 7px;white-space:nowrap}#b-pres{display:none}}
#bar button{background:none;border:0;border-radius:6px;padding:6px 9px;cursor:pointer;color:var(--secondary);min-height:34px}
#bar button:hover,#bar button:focus-visible,#bar button[aria-pressed=true]{background:var(--surface);color:var(--fg);outline:none}
#progress{position:fixed;left:0;top:0;height:3px;background:var(--accent);width:0;transition:width .2s;z-index:3}

/* Side panels: notes (presenter only), transcript, data. */
.panel{display:none;background:var(--bg);border-top:1px solid var(--border);overflow:auto;padding:14px 22px 20px;height:34%;flex:none}
.panel.on{display:block}
.panel h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin:0 0 8px;font-weight:600}
.panel .field{margin:0 0 10px}.panel .field b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--secondary)}
.panel code{font:0.9em ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--surface);padding:0 4px;border-radius:4px}
.panel .empty{color:var(--secondary)}
.panel table{border-collapse:collapse;font:13px ui-monospace,SFMono-Regular,Consolas,monospace;margin:6px 0 12px}
.panel th,.panel td{border-bottom:1px solid var(--border);padding:3px 12px 3px 0;text-align:right}
.panel th{color:var(--secondary);font-weight:600}
.panel .file{display:flex;gap:12px;align-items:baseline;margin-top:10px}
.panel .file button{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:2px 10px;cursor:pointer}

/* Overview: every frame, filterable by search. */
#overview{position:fixed;inset:0;z-index:5;background:var(--chrome);display:none;flex-direction:column}
#overview.on{display:flex}
#overview header{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border)}
#overview input{flex:1;max-width:520px;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:8px 12px}
#overview input:focus{outline:2px solid var(--accent);outline-offset:1px}
#overview header button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer}
#overview .count{color:var(--secondary);font-size:14px}
#grid{flex:1;overflow:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;align-content:start}
#grid a{display:block;color:inherit;text-decoration:none;border-radius:8px;padding:6px}
#grid a:hover,#grid a:focus-visible{background:var(--surface);outline:none}
#grid a.current{box-shadow:0 0 0 2px var(--accent)}
#grid img{width:100%;aspect-ratio:16/9;display:block;border-radius:4px;border:1px solid var(--border);background:var(--bg)}
#grid span{display:block;font-size:13px;margin-top:6px;color:var(--secondary)}
#grid span b{color:var(--accent-text);font-weight:600;margin-right:6px}

#help{position:fixed;inset:0;z-index:6;background:rgba(10,16,28,.72);display:none;align-items:center;justify-content:center}
#help.on{display:flex}
#help div{background:var(--bg);border-radius:10px;padding:22px 28px;line-height:2.1;box-shadow:0 12px 40px rgba(0,0,0,.3)}

/* Presenter window: current slide, next slide, notes, clock. */
body.presenter #area{flex:none;height:62%}
body.presenter #main{flex-direction:column}
body.presenter #bar .audience{display:none}
#next{display:none}
body.presenter #next{display:block;position:fixed;right:16px;top:12px;width:24%;z-index:2}
body.presenter #next img{width:100%;aspect-ratio:16/9;border-radius:4px;border:1px solid var(--border);background:var(--bg);display:block}
body.presenter #next span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--secondary)}
body.presenter #area{padding-right:calc(24% + 28px)}
#clock{display:none;font:600 22px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--fg);cursor:pointer}
body.presenter #clock{display:inline}
</style>
</head>
<body>
<div id="progress"></div>
<div id="main">
  <div id="area">
    <div id="stage">
      <img id="img-a" alt=""><img id="img-b" class="back" alt="" aria-hidden="true">
      <button class="hit l" aria-label="Previous"></button><button class="hit r" aria-label="Next"></button>
    </div>
  </div>
  <div id="next"><span>Next</span><img alt=""></div>
  <section id="p-notes" class="panel" aria-label="Speaker notes"></section>
  <section id="p-transcript" class="panel" aria-label="Transcript"></section>
  <section id="p-data" class="panel" aria-label="Data"></section>
  <div id="bar">
    <span id="count"></span><span class="title" id="where"></span>
    <span id="clock" title="Click to reset">0:00</span>
    <button id="b-prev" aria-label="Previous (←)">←</button>
    <button id="b-next" aria-label="Next (→)">→</button>
    <button id="b-over" title="Overview and search (O, /)">Overview</button>
    <button id="b-trans" class="audience" title="Transcript (C)" aria-pressed="false">Transcript</button>
    <button id="b-data" class="audience" title="Data (D)" aria-pressed="false">Data</button>
    <button id="b-theme" title="Light or dark (T)">Theme</button>
    <button id="b-pres" class="audience" title="Presenter window (P)">Presenter</button>
    <button id="b-help" title="Keys (?)">?</button>
  </div>
</div>
<div id="overview" role="dialog" aria-label="All slides">
  <header><input id="q" type="search" placeholder="Search titles, slide text and transcript" aria-label="Search slides">
    <span class="count" id="q-count"></span><button id="o-close" class="panel-close">Close (Esc)</button></header>
  <nav id="grid"></nav>
</div>
<div id="help" role="dialog" aria-label="Keyboard shortcuts"><div>
  <kbd>→</kbd> <kbd>Space</kbd> next step &nbsp; <kbd>←</kbd> back &nbsp; <kbd>Home</kbd> <kbd>End</kbd><br>
  <kbd>O</kbd> overview &nbsp; <kbd>/</kbd> search &nbsp; <kbd>T</kbd> light / dark<br>
  <kbd>C</kbd> transcript &nbsp; <kbd>D</kbd> data &nbsp; <kbd>N</kbd> notes (presenter)<br>
  <kbd>P</kbd> presenter window &nbsp; <kbd>F</kbd> fullscreen &nbsp; <kbd>Esc</kbd> close
</div></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="textlayer" class="sr"></div>

<script type="application/json" id="talk-data">{{DATA_JSON}}</script>
<script>
/* ===== Talk runtime. Generated; edit web/shell.html in the template, not this file. ===== */
const Talk=(()=>{
  const $=s=>document.querySelector(s);
  const T=JSON.parse($('#talk-data').textContent);
  const F=T.frames, params=new URLSearchParams(location.search);
  const presenter=params.has('presenter');
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
  const pad=n=>String(n).padStart(3,'0');
  const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
  let i=0,step=0,notes=null,t0=Date.now(),channel=null;
  let theme=store.get('talk-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  if(!T.themes.includes(theme))theme=T.themes[0];

  const src=(page,th=theme)=>`slides/${th}/${pad(page)}.svg`;
  const cache={};
  const preload=p=>{const k=src(p);if(!cache[k]){const im=new Image();im.src=k;cache[k]=im}};

  function applyTheme(){
    document.documentElement.dataset.theme=theme;
    $('#b-theme').textContent=theme==='dark'?'Light':'Dark';
    $('#b-theme').disabled=T.themes.length<2;
  }
  let front=$('#img-a'),back=$('#img-b');
  function show(page){
    const url=src(page);
    if(front.getAttribute('src')===url)return;
    const swap=()=>{back.onload=null;back.classList.remove('back');back.removeAttribute('aria-hidden');
      front.classList.add('back');front.setAttribute('aria-hidden','true');[front,back]=[back,front]};
    back.alt=F[i].title;
    if(back.getAttribute('src')===url&&back.complete){swap();return}
    back.onload=swap;back.src=url;
  }
  function render(){
    const f=F[i],page=f.pages[step];
    show(page);
    front.alt=f.title;
    [f.pages[step+1],(F[i+1]||{}).pages?.[0]].forEach(p=>p&&preload(p));
    $('#count').textContent=`${i+1} / ${F.length}`;
    $('#where').textContent=f.title+(f.pages.length>1?`  ·  step ${step+1} of ${f.pages.length}`:'');
    $('#progress').style.width=`${100*(i+(step+1)/f.pages.length)/F.length}%`;
    $('#live').textContent=`Slide ${i+1} of ${F.length}: ${f.title}`;
    $('#textlayer').textContent=f.text;
    const n=F[i+1];
    if(presenter){$('#next img').src=n?src(n.pages[n.pages.length-1]):'';$('#next span').textContent=n?`Next: ${n.title}`:'End of talk'}
    renderPanels();
    if(location.hash!=='#'+(i+1))history.replaceState(null,'',location.pathname+location.search+'#'+(i+1));
  }
  function go(n,st=0,fromSync=false){
    i=Math.max(0,Math.min(F.length-1,n));
    step=st<0?F[i].pages.length-1:Math.min(st,F[i].pages.length-1);
    render();
    if(!fromSync&&channel)channel.postMessage({i,step});
  }
  const next=()=>step<F[i].pages.length-1?go(i,step+1):i<F.length-1&&go(i+1,0);
  const prev=()=>step>0?go(i,step-1):i>0&&go(i-1,-1);

  function fit(){
    const a=$('#area').getBoundingClientRect(),st=$('#stage');
    const w=Math.max(160,Math.min(a.width-24,(a.height-24)*16/9));
    st.style.width=w+'px';st.style.height=(w*9/16)+'px';
  }
  addEventListener('resize',fit);

  /* --- panels --- */
  const panels={notes:$('#p-notes'),transcript:$('#p-transcript'),data:$('#p-data')};
  let open=presenter?'notes':null;
  function toggle(name){open=open===name?null:name;for(const [k,el] of Object.entries(panels))el.classList.toggle('on',k===open);
    $('#b-trans').setAttribute('aria-pressed',open==='transcript');$('#b-data').setAttribute('aria-pressed',open==='data');fit();renderPanels()}
  const inline=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  function parseNotes(md){
    const out={};let cur=null,field=null;
    for(const line of md.split('\n')){
      const h=line.match(/^##\s+(\S+)\s*$/);if(h){cur=out[h[1]]=[];field=null;continue}
      if(!cur)continue;
      const f=line.match(/^\*\*([^*:]+):\*\*\s*(.*)$/);if(f){field={label:f[1],text:f[2],items:[]};cur.push(field);continue}
      const li=line.match(/^\s*[-*]\s+(.*)$/);if(li&&field){field.items.push(li[1]);continue}
      if(line.trim()&&field)field.text+=(field.text?' ':'')+line.trim();
    }
    return out;
  }
  function renderPanels(){
    const f=F[i];
    if(open==='notes'){
      const sec=notes&&notes[f.id];
      panels.notes.innerHTML=`<h2>Notes · ${esc(f.title)}</h2>`+(!notes?`<p class="empty">No notes loaded. Notes live in notes.md beside this page and load only when it is served over HTTP.</p>`
        :!sec?`<p class="empty">No notes for ${esc(f.id)}.</p>`
        :sec.map(x=>`<div class="field"><b>${esc(x.label)}</b>${x.text?`<div>${inline(x.text)}</div>`:''}${x.items.length?`<ul>${x.items.map(y=>`<li>${inline(y)}</li>`).join('')}</ul>`:''}</div>`).join(''));
    }
    if(open==='transcript')panels.transcript.innerHTML=`<h2>Transcript · ${esc(f.title)}</h2>`+(f.narration?`<p>${esc(f.narration)}</p>`:`<p class="empty">No narration for this slide.</p>`)+(f.source?`<p class="empty">${esc(f.source)}</p>`:'');
    if(open==='data'&&!panels.data.dataset.done){
      panels.data.dataset.done=1;
      panels.data.innerHTML=`<h2>Data used by this talk</h2>`+(T.data.length?T.data.map((d,k)=>{
        const rows=d.csv.trim().split('\n').map(r=>r.split(','));
        return `<div class="file"><code>${esc(d.path)}</code><span class="empty">${rows.length-1} rows</span><button data-k="${k}">Download</button></div><table><tr>${rows[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.slice(1,9).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`}).join(''):`<p class="empty">This talk reads no data files.</p>`);
      panels.data.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const d=T.data[+b.dataset.k];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d.csv],{type:'text/csv'}));a.download=d.path.split('/').pop();a.click()});
    }
  }
  const loadNotes=()=>fetch('notes.md').then(r=>r.ok?r.text():null).then(t=>{if(t)notes=parseNotes(t);renderPanels()}).catch(()=>renderPanels());

  /* --- overview and search --- */
  const over=$('#overview'),grid=$('#grid'),q=$('#q');
  function fillGrid(){
    const words=q.value.toLowerCase().split(/\s+/).filter(Boolean);
    let shown=0;
    grid.innerHTML=F.map((f,k)=>{
      const hay=(f.title+' '+f.text+' '+f.narration).toLowerCase();
      if(words.some(w=>!hay.includes(w)))return '';
      shown++;
      return `<a href="#${k+1}" data-k="${k}" class="${k===i?'current':''}"><img loading="lazy" alt="" src="${src(f.pages[f.pages.length-1])}"><span><b>${k+1}</b>${esc(f.title)}</span></a>`}).join('');
    $('#q-count').textContent=`${shown} of ${F.length}`;
    grid.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();closeOverview();go(+a.dataset.k)});
  }
  function openOverview(focus){over.classList.add('on');fillGrid();if(focus)q.focus();else grid.querySelector('.current')?.focus()}
  function closeOverview(){over.classList.remove('on')}
  q.oninput=fillGrid;$('#o-close').onclick=closeOverview;

  /* --- input --- */
  const help=$('#help');
  addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    const k=e.key;
    if(k==='Escape'){help.classList.remove('on');closeOverview();return}
    if(over.classList.contains('on')){if(k==='Enter'){const a=grid.querySelector('a');if(a&&document.activeElement===q){e.preventDefault();a.click()}}return}
    if(help.classList.contains('on')){help.classList.remove('on');e.preventDefault();return}
    if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();next()}
    else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();prev()}
    else if(k==='Home')go(0);else if(k==='End')go(F.length-1,-1);
    else if(k==='o'||k==='O')openOverview(false);
    else if(k==='/'){e.preventDefault();openOverview(true)}
    else if(k==='t'||k==='T')setTheme(theme==='dark'?'light':'dark');
    else if(k==='c'||k==='C')toggle('transcript');
    else if(k==='d'||k==='D')toggle('data');
    else if(k==='n'||k==='N')toggle('notes');
    else if(k==='p'||k==='P')openPresenter();
    else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}
    else if(k==='?')help.classList.add('on');
  });
  function setTheme(t){if(!T.themes.includes(t))return;theme=t;store.set('talk-theme',t);applyTheme();render();if(over.classList.contains('on'))fillGrid()}
  function openPresenter(){window.open(location.pathname+'?presenter#'+(i+1),'talk-presenter','width=1360,height=860')}
  $('#b-prev').onclick=prev;$('#b-next').onclick=next;$('.hit.l').onclick=prev;$('.hit.r').onclick=next;
  $('#b-over').onclick=()=>openOverview(false);$('#b-theme').onclick=()=>setTheme(theme==='dark'?'light':'dark');
  $('#b-trans').onclick=()=>toggle('transcript');$('#b-data').onclick=()=>toggle('data');
  $('#b-pres').onclick=openPresenter;$('#b-help').onclick=()=>help.classList.add('on');help.onclick=()=>help.classList.remove('on');
  $('#clock').onclick=()=>{t0=Date.now()};
  let tx=null;
  $('#stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  $('#stage').addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>50)d<0?next():prev()});
  addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n&&n-1!==i)go(n-1,0,true)});
  setInterval(()=>{if(!presenter)return;const s=Math.floor((Date.now()-t0)/1000);$('#clock').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500);
  try{channel=new BroadcastChannel('talk:'+location.pathname);channel.onmessage=e=>go(e.data.i,e.data.step,true)}catch{}

  /* --- WebMCP: read-only tools. Speaker notes are never exposed. --- */
  function registerTools(){
    const mc=document.modelContext||navigator.modelContext;if(!mc)return;
    const text=v=>({content:[{type:'text',text:typeof v==='string'?v:JSON.stringify(v)}]});
    const ro={readOnlyHint:true},empty={type:'object',properties:{}};
    const find=s=>F.find(f=>f.id===s)||F[(+s||0)-1];
    mc.registerTool({name:'get_metadata',description:'Talk title, author, date and the slide list with ids and titles.',inputSchema:empty,annotations:ro,
      async execute(){return text({title:T.title,subtitle:T.subtitle,author:T.author,date:T.date,slides:F.map(f=>({n:f.n,id:f.id,title:f.title,section:f.section,steps:f.pages.length}))})}});
    mc.registerTool({name:'get_slide',description:'Text, transcript and source line of one slide by id or 1-based number.',inputSchema:{type:'object',properties:{slide:{type:'string'}},required:['slide']},annotations:ro,
      async execute({slide}){const f=find(slide);return text(f?{id:f.id,title:f.title,text:f.text,transcript:f.narration,source:f.source}:'No such slide')}});
    mc.registerTool({name:'search_slides',description:'Slides whose title, text or transcript contain every word of the query.',inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},annotations:ro,
      async execute({query}){const w=query.toLowerCase().split(/\s+/).filter(Boolean);return text(F.filter(f=>w.every(x=>(f.title+' '+f.text+' '+f.narration).toLowerCase().includes(x))).map(f=>({n:f.n,id:f.id,title:f.title})))}});
    mc.registerTool({name:'get_data',description:'The data files (CSV) this talk reads, by path; all of them without a path.',inputSchema:{type:'object',properties:{path:{type:'string'}}},annotations:ro,
      async execute({path}={}){return text(path?(T.data.find(d=>d.path===path)||{error:'no such file'}):T.data)}});
  }

  /* --- audit: every page image of every frame loads, in every theme. --- */
  async function audit(){
    const jobs=[];for(const th of T.themes)for(const f of F)for(const p of f.pages)jobs.push(new Promise(r=>{const im=new Image();im.onload=()=>r(null);im.onerror=()=>r(`${f.id}: ${src(p,th)} failed to load`);im.src=src(p,th)}));
    return (await Promise.all(jobs)).filter(Boolean);
  }

  function boot(){
    if(presenter){document.body.classList.add('presenter');panels.notes.classList.add('on');document.title='Presenter · '+document.title}
    applyTheme();fit();
    const n=parseInt(location.hash.slice(1),10);
    go(n?n-1:0,0,true);
    registerTools();loadNotes();
  }
  boot();
  return {go,next,prev,frames:F,audit,setTheme,get state(){return {i,step,theme}}};
})();
</script>
</body>
</html>
