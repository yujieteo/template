name: Build talks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-extra texlive-latex-recommended texlive-fonts-recommended \
            texlive-pictures latexmk lmodern cm-super

      # Lints every talk.tex, checks generated data and tokens are current,
      # builds all six variants, and rebuilds them to prove identical bytes.
      - name: Build and verify
        run: python3 scripts/build.py --check

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: talks
          path: |
            talks/*/build/*.pdf
            talks/*/build/SHA256SUMS
